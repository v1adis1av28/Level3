<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Event Booker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { margin: 20px 0; }
        label { display: block; margin: 10px 0; }
        input, button { padding: 8px; }
    </style>
</head>
<body>
    <h1>Admin Panel</h1>
    <h2>Create Event</h2>
    <form id="createForm">
        <label>Name: <input type="text" id="name" required></label>
        <label>Description: <input type="text" id="description" required></label>
        <label>Capacity: <input type="number" id="capacity" required></label>
        <label>Confirmation Needed: <input type="checkbox" id="confirmation"></label>
        <button type="submit">Create Event</button>
    </form>
    <div id="message"></div>

    <script>
        const API_BASE = "http://localhost:8080";

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const body = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                capacity: parseInt(document.getElementById('capacity').value),
                confirmation_need: document.getElementById('confirmation').checked
            };

            try {
                const res = await fetch(`${API_BASE}/events`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (data.result) {
                    document.getElementById('message').innerHTML =
                        `<p style="color:green;">Event created successfully! ID: ${data.event.id || "(not returned)"}</p>`;
                } else {
                    document.getElementById('message').innerHTML =
                        `<p style="color:red;">Error: ${data.error?.Description || "Unknown error"}</p>`;
                }
            } catch (err) {
                document.getElementById('message').innerHTML =
                    `<p style="color:red;">Network error</p>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
